# Local development/test stack only. Pin image tags and update them through a reviewed image update.
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onebox}
      POSTGRES_USER: ${POSTGRES_USER:-onebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - onebox-local

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - onebox-local

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      SERVICE_ROLE: api
      AUTOMATION_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onebox}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}@postgres:5432/${POSTGRES_DB:-onebox}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your local environment}
      ALGORITHM: HS256
      JWT_ISSUER: ${JWT_ISSUER:-https://issuer.example.invalid}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-onebox-api}
      GOOGLE_OAUTH_CLIENT_SECRETS: ${GOOGLE_OAUTH_CLIENT_SECRETS:?Set GOOGLE_OAUTH_CLIENT_SECRETS to a mounted credential path}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/agent/oauth/callback}
      FRONTEND_OAUTH_CALLBACK_URI: ${FRONTEND_OAUTH_CALLBACK_URI:-http://localhost:3000/mail/inbox}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:?Set GOOGLE_PROJECT_ID in your local environment}
      GOOGLE_LOCATION: ${GOOGLE_LOCATION:-us-central1}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.0-flash-lite}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - onebox-local

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onebox}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}@postgres:5432/${POSTGRES_DB:-onebox}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your local environment}
      ALGORITHM: HS256
      JWT_ISSUER: ${JWT_ISSUER:-https://issuer.example.invalid}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-onebox-api}
      GOOGLE_OAUTH_CLIENT_SECRETS: ${GOOGLE_OAUTH_CLIENT_SECRETS:?Set GOOGLE_OAUTH_CLIENT_SECRETS to a mounted credential path}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/agent/oauth/callback}
      FRONTEND_OAUTH_CALLBACK_URI: ${FRONTEND_OAUTH_CALLBACK_URI:-http://localhost:3000/mail/inbox}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:?Set GOOGLE_PROJECT_ID in your local environment}
      GOOGLE_LOCATION: ${GOOGLE_LOCATION:-us-central1}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.0-flash-lite}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onebox-local

networks:
  onebox-local:
    driver: bridge

volumes:
  postgres-data:
