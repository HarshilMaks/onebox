x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onebox}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}@postgres:5432/${POSTGRES_DB:-onebox}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your local environment}
  ALGORITHM: HS256
  JWT_ISSUER: ${JWT_ISSUER:-https://issuer.example.invalid}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-onebox-api}
  GOOGLE_OAUTH_CLIENT_SECRETS: /run/secrets/onebox_oauth.json
  OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/agent/oauth/callback}
  FRONTEND_OAUTH_CALLBACK_URI: ${FRONTEND_OAUTH_CALLBACK_URI:-http://localhost:3000/mail/inbox}
  GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:?Set GOOGLE_PROJECT_ID in your local environment}
  GOOGLE_LOCATION: ${GOOGLE_LOCATION:-us-central1}
  GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.0-flash-lite}
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/executive-agent.json
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

x-automation-environment: &automation-environment
  AUTOMATION_ENABLED: "true"
  AUTOMATION_OWNER_ID: ${AUTOMATION_OWNER_ID:?Set AUTOMATION_OWNER_ID in your local environment}
  PUBSUB_TOPIC: ${PUBSUB_TOPIC:?Set PUBSUB_TOPIC in your local environment}
  PUBSUB_SUBSCRIPTION: ${PUBSUB_SUBSCRIPTION:?Set PUBSUB_SUBSCRIPTION in your local environment}
  PUBSUB_PUSH_AUDIENCE: ${PUBSUB_PUSH_AUDIENCE:?Set PUBSUB_PUSH_AUDIENCE in your local environment}
  PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL: ${PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL:?Set PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL in your local environment}

x-runtime-volumes: &runtime-volumes
  - ${GOOGLE_OAUTH_CLIENT_SECRETS_HOST_PATH:?Set GOOGLE_OAUTH_CLIENT_SECRETS_HOST_PATH}:/run/secrets/onebox_oauth.json:ro
  - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:?Set GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH}:/run/secrets/executive-agent.json:ro

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onebox}
      POSTGRES_USER: ${POSTGRES_USER:-onebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - onebox-local

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - onebox-local

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: [*runtime-environment, *automation-environment]
      SERVICE_ROLE: api
    volumes: *runtime-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onebox-local

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      <<: [*runtime-environment, *automation-environment]
      ENVIRONMENT: development
      SERVICE_ROLE: api
    volumes: *runtime-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - onebox-local

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "server.workers"]
    restart: unless-stopped
    environment:
      <<: [*runtime-environment, *automation-environment]
      ENVIRONMENT: development
      SERVICE_ROLE: automation_worker
    volumes: *runtime-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - onebox-local

networks:
  onebox-local:
    driver: bridge

volumes:
  postgres-data:
