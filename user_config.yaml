full_name: Account Owner
name: Owner
title: Owner
priority_domains:
  - example.com
important_contacts:
  - "owner@example.com"
timezone: "UTC"

background: |
  Configure this profile with the account owner's role and context so the agent can tailor its responses.

schedule_preferences: |
  Default meetings are 30 minutes unless a longer session is required.

background_preferences: |
  Describe here how requests in specific areas should be routed or delegated.

response_preferences: |
  Keep communication clear, structured, and concise.
  - Be direct and avoid filler.
  - Match the tone of the person being replied to.
  - No greetings or sign-offs unless the other person initiates them.

triage_no: |
  - Cold outreach and unsolicited vendor pitches without clear relevance
  - Automated reports from CI/CD or monitoring tools unless they signal a failure
  - Calendar invites without any email thread context
  - FYI-only messages with no clear action for the owner

triage_notify: |
  - Messages from partners or collaborators about critical issues in live services
  - Legal, contract, or funding-related items
  - Time-sensitive requests that reference the product or ongoing work
  - Any report of a production outage or performance degradation

triage_email: |
  - Questions from users or developers about integration or deployment
  - Product feedback or bug reports that may indicate systemic issues
  - Collaboration or partnership requests that align with current goals
  - Follow-ups from people the owner has committed to responding to
  - Critical updates about running infrastructure, billing, or data access
