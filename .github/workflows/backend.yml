name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main
      - backend/**

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      PYTHONPATH: ${{ github.workspace }}
      SERVICE_ROLE: api
      AUTOMATION_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://onebox:test-password@localhost:5432/onebox
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-with-at-least-thirty-two-characters
      ALGORITHM: HS256
      JWT_ISSUER: https://issuer.example.invalid
      JWT_AUDIENCE: onebox-api
      GOOGLE_OAUTH_CLIENT_SECRETS: test-oauth-client.json
      OAUTH_REDIRECT_URI: http://localhost:8000/agent/oauth/callback
      FRONTEND_OAUTH_CALLBACK_URI: http://localhost:3000/mail/inbox
      GOOGLE_PROJECT_ID: onebox-test-project
      GOOGLE_LOCATION: us-central1
      GOOGLE_MODEL: gemini-test-model
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify lock inputs
        run: |
          pip-compile --dry-run requirements.in
          pip-compile --allow-unsafe --dry-run requirements-dev.in
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Check migration graph
        run: |
          alembic heads
          alembic history --verbose

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --no-cache -t onebox:test .
      - name: Verify runtime image contents and UID
        run: |
          docker run --rm --entrypoint sh onebox:test -c \
            'test "$(id -u)" != 0; test ! -e /app/.env; test ! -e /app/.git; test ! -e /app/.agents; test ! -e /app/tests; test -z "$(find /app -type f -name "*.json" -print -quit)"'

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
