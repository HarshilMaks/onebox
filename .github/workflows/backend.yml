name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main
      - backend/**

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: onebox
          POSTGRES_USER: onebox
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onebox -d onebox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      PYTHONPATH: ${{ github.workspace }}
      SERVICE_ROLE: api
      AUTOMATION_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://onebox:test-password@localhost:5432/onebox
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-with-at-least-thirty-two-characters
      ALGORITHM: HS256
      JWT_ISSUER: https://issuer.example.invalid
      JWT_AUDIENCE: onebox-api
      GOOGLE_OAUTH_CLIENT_SECRETS: test-oauth-client.json
      OAUTH_REDIRECT_URI: http://localhost:8000/agent/oauth/callback
      FRONTEND_OAUTH_CALLBACK_URI: http://localhost:3000/mail/inbox
      GOOGLE_PROJECT_ID: onebox-test-project
      GOOGLE_LOCATION: us-central1
      GOOGLE_MODEL: gemini-test-model
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      POSTGRES_PASSWORD: test-password
      GOOGLE_OAUTH_CLIENT_SECRETS_HOST_PATH: /tmp/onebox-oauth-client.json
      GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH: /tmp/onebox-service-account.json
      OAUTH_TOKEN_KEYRING_PATH: /tmp/onebox-oauth-keyring.json
      OAUTH_TOKEN_KEYRING_HOST_PATH: /tmp/onebox-oauth-keyring.json
      OAUTH_TOKEN_ACTIVE_KEY_ID: test-key-id
      AUTOMATION_OWNER_ID: 00000000-0000-0000-0000-000000000001
      PUBSUB_TOPIC: projects/onebox-test-project/topics/gmail-notifications
      PUBSUB_SUBSCRIPTION: projects/onebox-test-project/subscriptions/gmail-notifications
      PUBSUB_PUSH_AUDIENCE: https://api.example.invalid/mail/notifications
      PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL: pubsub-push@onebox-test-project.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify lock inputs
        run: |
          pip-compile --dry-run requirements.in
          pip-compile --allow-unsafe --dry-run requirements-dev.in
      - name: Lint
        run: ruff check .
      - name: Verify generated OpenAPI contract
        run: python scripts/generate_openapi.py --check
      - name: Compile application
        run: python -m compileall server tools clients agents.py scripts/generate_openapi.py
      - name: Apply migrations and detect model drift
        run: |
          alembic upgrade head
          alembic check
      - name: Test
        run: pytest -q
      - name: Check migration graph
        run: |
          alembic heads
          alembic history --verbose
      - name: Render Compose topology
        run: docker compose config -q

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --no-cache -t onebox:test .
      - name: Verify runtime image contents and UID
        run: |
          docker run --rm --entrypoint sh onebox:test -c \
            'test "$(id -u)" != 0; test ! -e /app/.env; test ! -e /app/.git; test ! -e /app/.agents; test ! -e /app/tests; test -z "$(find /app -type f -name "*.json" -print -quit)"'

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
